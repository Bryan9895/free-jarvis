[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-assistant"
version = "0.5.0"
description = "ADAM - Assistente Digital Autônomo Modular com FCC e ElevenLabs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48"]
voice = ["sounddevice>=0.4.6", "numpy>=1.24", "faster-whisper>=1.2.1", "av>=11,<19"]
desktop = ["dbus-next>=0.2.3"]
vision = ["Pillow>=10.0"]

[project.scripts]
jarvis-fcc = "jarvis.cli:main"
jarvis = "jarvis.cli:main"
jarvis-show = "jarvis.gui:launch"
adam = "jarvis.cli:main"
adam-show = "jarvis.gui:launch"
adam-team = "jarvis.engineering_team:main"

[tool.setuptools.packages.find]
where = ["src"]
