[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-fcc"
version = "0.1.0"
description = "Assistente pessoal modular usando Free Claude Code Responses API"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48"]
voice = ["sounddevice>=0.4.6", "numpy>=1.24", "faster-whisper>=1.1"]
desktop = ["dbus-next>=0.2.3"]

[project.scripts]
jarvis-fcc = "jarvis.cli:main"
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
