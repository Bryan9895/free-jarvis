[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-fcc"
version = "0.1.0"
description = "Assistente pessoal modular usando Free Claude Code Responses API"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
