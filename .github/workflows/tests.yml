name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vision]' 'numpy>=1.24' 'av>=11,<19'
      - run: python -m unittest discover -s tests -v
      - name: Validate Tkinter Canvas in virtual X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m unittest discover -s tests -p 'test_adam_tk.py' -v

  python314-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check Ubuntu launcher syntax and Python requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libsndfile1
          bash -n tools/install_ubuntu.sh
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[voice,desktop]'
      - name: Verify voice stack and ADAM without hardware
        run: |
          .venv/bin/python -m pip check
          # Em CI headless não há servidor PulseAudio nem dispositivo físico:
          # verificar presença do pacote em vez de inicializar PortAudio.
          .venv/bin/python -c 'import importlib.metadata as md; assert md.version("sounddevice"); import numpy, av, faster_whisper; import jarvis.gui; import jarvis.elevenlabs_tts'
          .venv/bin/python -m unittest discover -s tests -p 'test_adam.py' -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_browser_e2e.py' -v

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: free-jarvis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install from the actual cloned repository
        run: |
          cd free-jarvis
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e .
          jarvis-fcc --doctor
          python -m jarvis --doctor
          jarvis-fcc --help | grep -- '--check-fcc'
      - name: Check launch in a different working directory
        run: |
          . free-jarvis/.venv/bin/activate
          cd /tmp
          jarvis-fcc --doctor | grep '"application": "jarvis-fcc"'
