name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vision]'
      - run: python -m unittest discover -s tests -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_browser_e2e.py' -v

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: free-jarvis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install from the actual cloned repository
        run: |
          cd free-jarvis
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e .
          jarvis-fcc --doctor
          python -m jarvis --doctor
          jarvis-fcc --help | grep -- '--check-fcc'
      - name: Check launch in a different working directory
        run: |
          . free-jarvis/.venv/bin/activate
          cd /tmp
          jarvis-fcc --doctor | grep '"application": "jarvis-fcc"'
